<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex - Cyber Intelligence OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050b0c;
            color: #00ffcc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.2);
        }

        /* Top CIA style bar */
        .system-header {
            padding: 10px;
            background: rgba(0, 255, 204, 0.05);
            border-bottom: 1px solid #00ffcc;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        /* Main HUD Grid */
        .hud-container {
            flex: 1;
            display: grid;
            grid-template-rows: 1fr auto;
            padding: 15px;
            gap: 15px;
        }

        /* Central AI Visualizer */
        .ai-core {
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(0, 30, 30, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.05);
        }

        .ai-core::before {
            content: "ALEX INTEL CORE v1.0.0";
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 10px;
            opacity: 0.7;
        }

        /* Voice Waveform Simulator */
        .pulse-ring {
            width: 120px;
            height: 120px;
            border: 3px double #00ffcc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            animation: rotate 6s linear infinite;
        }

        .inner-core {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(0,255,204,0.6) 0%, rgba(5,11,12,1) 70%);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .console-output {
            width: 100%;
            padding: 15px;
            font-size: 13px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 5px #00ffcc;
            margin-top: 20px;
        }

        /* Bottom Command Input area */
        .control-panel {
            display: flex;
            gap: 10px;
        }

        .cmd-input {
            flex: 1;
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid #00ffcc;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .cmd-input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .mic-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 0 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.3s;
        }

        .mic-btn:active {
            background: #00ffcc;
            color: #050b0c;
            box-shadow: 0 0 15px #00ffcc;
        }

        /* Animations */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 25px rgba(0, 255, 204, 0.5); }
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="system-header">
        <div>SYS_STATUS: ACTIVE <span class="status-dot"></span></div>
        <div>SECURE_CONN_ESTABLISHED</div>
    </div>

    <div class="hud-container">
        <div class="ai-core">
            <div class="pulse-ring">
                <div class="inner-core"></div>
            </div>
            <div class="console-output" id="alexStatus">
                Sema kitu mkuu, Alex yuko tayari kusikiliza amri yako...
            </div>
        </div>

        <div class="control-panel">
            <input type="text" class="cmd-input" id="cmdInput" placeholder="Andika amri hapa (e.g., washa wifi)...">
            <button class="mic-btn" onclick="startListening()">Sauti</button>
        </div>
    </div>

    <script>
        function startListening() {
            document.getElementById('alexStatus').innerHTML = "<span style='color: #00ffcc;'>[ALEX INASIKILIZA...]</span>";
            // Kazi ya AI tutaiweka hapa chini baadae
        }
    </script>
</body>
</html>
